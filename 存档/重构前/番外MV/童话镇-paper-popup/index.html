<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#343946">
<title>童话镇 · Paper Pop-up Book</title>
<link rel="stylesheet" href="./fonts.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#343946;color:#fff5df;font-family:"ZCOOL KuaiLe",sans-serif}
  #stage,#ov,#controls{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left}
  #stage{z-index:0}
  #stage canvas{display:block;width:1920px;height:1080px}
  #ov{z-index:2;pointer-events:none}
  #controls{z-index:3;pointer-events:none}
  #transport{position:absolute;top:26px;right:30px;display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid rgba(250,231,195,.38);border-radius:18px;background:rgba(39,43,55,.76);box-shadow:0 10px 28px rgba(0,0,0,.18);pointer-events:auto;backdrop-filter:blur(8px)}
  #play{border:0;border-radius:12px;padding:10px 17px;background:#f0d18b;color:#353443;font:24px "ZCOOL KuaiLe",sans-serif;cursor:pointer}
  #play:hover{background:#ffe5a4}
  #seek{width:290px;accent-color:#e7c575;cursor:pointer}
  #clock{min-width:135px;text-align:center;font:19px Fredoka,sans-serif;letter-spacing:.03em}
  #hint{position:absolute;right:36px;top:92px;color:rgba(255,245,223,.76);font-size:18px;text-shadow:0 1px 4px #32313a;pointer-events:none}
  audio{display:none}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
  <div id="stage"></div>
  <canvas id="ov" width="1920" height="1080"></canvas>
  <div id="controls">
    <div id="transport">
      <button id="play" type="button">▶ 播放</button>
      <input id="seek" aria-label="时间位置" type="range" min="0" max="249.578667" step="0.033333" value="0">
      <span id="clock">00:00 / 04:09</span>
    </div>
    <div id="hint">空格播放／暂停，方向键前后跳 5 秒</div>
  </div>
  <audio id="song" preload="metadata" src="../../童话镇.mp4"></audio>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
