<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171425">
  <title>童话镇 · 像素童话MV</title>
  <style>
    :root { color-scheme: dark; background: #171425; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #171425; display: grid; place-items: center;
    }
    canvas {
      width: min(100vw, 177.7778vh);
      height: min(100vh, 56.25vw);
      max-width: 100vw; max-height: 100vh;
      object-fit: contain; image-rendering: pixelated; image-rendering: crisp-edges;
      display: block; cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="stage" width="1920" height="1080" aria-label="童话镇像素童话MV"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
